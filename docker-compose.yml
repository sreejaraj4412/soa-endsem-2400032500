name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: curd_2400032500
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curd_2400032500"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  country-service:
    image: sreeja9090/docker-curd-2400032500:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-service
    ports:
      - "32500:32500"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge